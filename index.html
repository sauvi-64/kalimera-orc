<style>
/* Layout: una colonna stretta da telefono. In alto la barca di riferimento, poi i comandi (miglia, percorso), poi la lista dei distacchi con una barretta che ne mostra l'entità. */
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;
  --ink: #10222F;
  --muted: #5B6E7A;
  --line: #D3DDE2;
  --accent: #0B6E80;
  --accent-ink: #FFFFFF;
  --get: #1A7A48;
  --give: #B63A2B;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C171E; --surface: #13232D; --ink: #E7EFF3; --muted: #8FA3AF; --line: #264050;
    --accent: #4FB6C8; --accent-ink: #06222A; --get: #5CCB8E; --give: #F0877A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C171E; --surface: #13232D; --ink: #E7EFF3; --muted: #8FA3AF; --line: #264050;
  --accent: #4FB6C8; --accent-ink: #06222A; --get: #5CCB8E; --give: #F0877A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
header .id { min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; margin: 4px 0 6px; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; }
button, select, input { font: inherit; color: inherit; }
.ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; color: var(--accent); font-weight: 600; cursor: pointer; flex: none;
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.fields { display: grid; grid-template-columns: 1fr 1.6fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.field input, .field select {
  width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
#miles { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.row-opts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
#q { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

.howto { color: var(--muted); font-size: 14px; margin: 0; }
.howto b.get { color: var(--get); }
.howto b.give { color: var(--give); }

.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.list-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0; }
#count { color: var(--muted); font-size: 14px; }
ul.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.item { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px 14px; }
.item + .item { border-top: 1px solid var(--line); }
.who { min-width: 0; }
.who b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.who span { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.gap { text-align: right; flex: none; }
.gap strong { display: block; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.gap small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.get .gap strong, .item.get .bar { color: var(--get); }
.give .gap strong, .item.give .bar { color: var(--give); }
.bar { position: absolute; left: 0; bottom: 0; height: 3px; width: var(--w, 0%); background: currentColor; opacity: .55; }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }

#picker[hidden] { display: none; }
#picker ul { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
#picker li button { width: 100%; text-align: left; background: transparent; border: 0; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
#picker li + li { border-top: 1px solid var(--line); }
#picker li button small { color: var(--muted); }
#picker li.sel button { background: var(--bg); font-weight: 600; }

footer { color: var(--muted); font-size: 13px; }

@media (max-width: 380px) {
  .fields { grid-template-columns: 1fr; }
  h1 { font-size: 34px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar { transition: width .25s ease; }
}
/* iOS/iPad: bersagli touch comodi */
.ghost, .seg button { min-height: 44px; }
.field input, .field select, #q, #pickQ { min-height: 44px; }
html { -webkit-text-size-adjust: 100%; }

</style>

    </div>
    <button class="ghost" id="changeBtn" type="button" aria-expanded="false" aria-controls="picker">Cambia barca</button>

  <section class="panel" id="picker" hidden>

    <input id="pickQ" type="search" placeholder="Cerca nome o numero velico" autocomplete="off" aria-label="Cerca barca di riferimento">

  <section class="panel">
    <div class="fields">
      <div class="field">
        <label for="miles">Miglia</label>

      </div>
      <div class="field">
        <label for="opt">Percorso</label>
        <select id="opt"></select>
      </div>
    </div>
    <input id="q" type="search" placeholder="Cerca nome, vela o classe" autocomplete="off" aria-label="Cerca tra le barche">
    <div class="row-opts">
      <label class="check"><input type="checkbox" id="same"> Solo stessa divisione</label>
      <div class="seg" role="group" aria-label="Ordine">
        <button type="button" id="sortGap" aria-pressed="true">Dai → Ricevi</button>
        <button type="button" id="sortNear" aria-pressed="false">Più vicine</button>
      </div>
    </div>
    <p class="howto" id="howto"></p>
  </section>

  <div class="list-head">
    <h2>Distacchi</h2>
    <span id="count"></span>
  </div>
  <ul class="list" id="list"></ul>

  <footer id="info"></footer>
</div>

met 45 S","C","2026-11-06",[505.1,626.2,549.9,644.2,501.4,452.7,830.2,620.9,550.3]],["MILU' 4","ITA-24100","Este 24","S","2026-11-06",[597.6,736.4,648.5,748.8,596.5,528.8,958.2,731.9,647.2]],["TARANTELLA","ITA-16131","Grand Soleil 40RCK","C","2026-11-06",[537.0,659.0,584.1,691.5,533.2,478.1,888.4,654.2,569.9]]];
const OPTS = [
  ["All Purpose", "Percorso misto"],
  ["Bastone (Windward/Leeward)", "Bolina e poppa"],
  ["Offshore, numero singolo", "Altura"],
  ["Offshore, vento leggero", "Triple Number"],
  ["Offshore, vento medio", "Triple Number"],
  ["Offshore, vento forte", "Triple Number"],
  ["Costiero, vento leggero", "Triple Number"],
  ["Costiero, vento medio", "Triple Number"],
  ["Costiero, vento forte", "Triple Number"]
];
const KEY = "kalimera-orc-v1";
const state = { ref: "ITA-17738", miles: 30, opt: 0, same: false, sort: "gap", q: "" };

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && typeof saved === "object") {
    if (typeof saved.ref === "string") state.ref = saved.ref;
    if (isFinite(saved.miles) && saved.miles > 0) state.miles = saved.miles;
    if (Number.isInteger(saved.opt) && saved.opt >= 0 && saved.opt < OPTS.length) state.opt = saved.opt;
    if (typeof saved.same === "boolean") state.same = saved.same;
    if (saved.sort === "gap" || saved.sort === "near") state.sort = saved.sort;
  }
} catch (e) {}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ ref: state.ref, miles: state.miles, opt: state.opt, same: state.same, sort: state.sort })); } catch (e) {}
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nice = (s) => s.toLowerCase().replace(/(^|[\s\-'’.])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

function fmt(sec) {
  const t = Math.round(Math.abs(sec));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
}

/* Compenso per pari merito: (allowance riferimento - allowance altra) x miglia.
   Positivo: il riferimento è valutato più lento e riceve tempo. Negativo: lo dà. */
function gaps(ref, boats, opt, miles) {
  return boats
    .filter((b) => b[1] !== ref[1])
    .map((b) => ({ boat: b, sec: (ref[5][opt] - b[5][opt]) * miles }));
}

function refBoat() { return DATA.find((b) => b[1] === state.ref) || DATA[0]; }

function render() {
  const ref = refBoat();
  $("refName").textContent = nice(ref[0]);
  $("refMeta").textContent = ref[1] + " · " + ref[2] + " · divisione " + (ref[3] || "-");

  let pool = DATA;
  if (state.same) pool = pool.filter((b) => b[3] === ref[3]);
  const q = state.q.trim().toLowerCase();
  if (q) pool = pool.filter((b) => (b[0] + " " + b[1] + " " + b[2]).toLowerCase().includes(q));

  const list = gaps(ref, pool, state.opt, state.miles);
  if (state.sort === "gap") list.sort((a, b) => a.sec - b.sec);
  else list.sort((a, b) => Math.abs(a.sec) - Math.abs(b.sec));
  const max = list.reduce((m, g) => Math.max(m, Math.abs(g.sec)), 1);

  $("count").textContent = list.length + " barche";
  $("list").innerHTML = list.length
    ? list.map((g) => {
        const zero = Math.round(Math.abs(g.sec)) === 0;
        const cls = zero ? "" : g.sec > 0 ? "get" : "give";
        const label = zero ? "pari" : g.sec > 0 ? "ricevi" : "dai";
        const w = Math.max(2, Math.round((Math.abs(g.sec) / max) * 100));
        return '<li class="item ' + cls + '"><div class="who"><b>' + esc(nice(g.boat[0])) + "</b><span>" +
          esc(g.boat[1] + " · " + g.boat[2] + " · div. " + (g.boat[3] || "-")) +
          '</span></div><div class="gap"><strong>' + (zero ? "0:00" : fmt(g.sec)) + "</strong><small>" + label +
          '</small></div><i class="bar" style="--w:' + w + '%"></i></li>';
      }).join("")
    : '<li class="empty">Nessuna barca corrisponde ai filtri.</li>';

  $("howto").innerHTML = "Con " + state.miles.toLocaleString("it-IT") + " miglia: <b class=\"get\">ricevi</b> = " +
    esc(nice(ref[0])) + " può arrivare dopo di quel tempo e restare in parità in compensato; <b class=\"give\">dai</b> = deve arrivare prima.";

  $("sortGap").setAttribute("aria-pressed", String(state.sort === "gap"));
  $("sortNear").setAttribute("aria-pressed", String(state.sort === "near"));
}

function renderPicker() {
  const q = $("pickQ").value.trim().toLowerCase();
  const sorted = DATA.slice().sort((a, b) => a[0].localeCompare(b[0], "it"));
  const hits = q ? sorted.filter((b) => (b[0] + " " + b[1]).toLowerCase().includes(q)) : sorted;
  $("pickList").innerHTML = hits.map((b) =>
    '<li class="' + (b[1] === state.ref ? "sel" : "") + '"><button type="button" data-sail="' + esc(b[1]) + '"><span>' +
    esc(nice(b[0])) + "</span><small>" + esc(b[1]) + "</small></button></li>").join("");
}

/* Comandi */
$("opt").innerHTML = OPTS.map((o, i) => '<option value="' + i + '">' + esc(o[0]) + "</option>").join("");
$("opt").value = String(state.opt);
$("miles").value = String(state.miles).replace(".", ",");
$("same").checked = state.same;

$("miles").addEventListener("input", (e) => {
  const v = parseFloat(e.target.value.replace(",", "."));
  if (isFinite(v) && v > 0) { state.miles = v; persist(); render(); }
});
$("opt").addEventListener("change", (e) => { state.opt = Number(e.target.value); persist(); render(); });
$("same").addEventListener("change", (e) => { state.same = e.target.checked; persist(); render(); });
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("sortGap").addEventListener("click", () => { state.sort = "gap"; persist(); render(); });
$("sortNear").addEventListener("click", () => { state.sort = "near"; persist(); render(); });

$("changeBtn").addEventListener("click", () => {
  const open = $("picker").hidden;
  $("picker").hidden = !open;
  $("changeBtn").setAttribute("aria-expanded", String(open));
  if (open) { $("pickQ").value = ""; renderPicker(); $("pickQ").focus(); }
});
$("pickQ").addEventListener("input", renderPicker);
$("pickList").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-sail]");
  if (!btn) return;
  state.ref = btn.dataset.sail;
  persist();
  $("picker").hidden = true;
  $("changeBtn").setAttribute("aria-expanded", "false");
  render();
});

const latest = DATA.reduce((m, b) => (b[4] > m ? b[4] : m), "");
const d = latest ? new Date(latest + "T00:00:00") : null;
$("info").textContent = "Dati ORC, certificati International Italia: " + DATA.length + " barche" +
  (d ? ", ultimo certificato del " + d.toLocaleDateString("it-IT") : "") +
  ". Il calcolo usa i secondi per miglio di ogni certificato.";

render();
</script>
